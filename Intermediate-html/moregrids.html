<!DOCTYPE html>
<html>
    <head>
        <title>moregrids</title>
    </head>
    <body>
        <div style="display: grid;
                    margin-bottom: 20px;
                    grid-template-columns: 200px 70px;">
            <div style="background-color: lightcoral;">200px</div>
            <div style="background-color: lightsalmon;">70px</div>
        </div>

        <div style="display: grid;
                    margin-bottom: 20px;
                    grid-template-columns: 50px 1fr 75px;">
            <div style="background-color: lightcoral;">50px</div>
            <div style="background-color: lightskyblue;">1fr</div>
            <div style="background-color: lightsalmon;">75px</div>
        </div>

        <div style="display: grid;
                    margin-bottom: 20px;
                    grid-template-columns: 1fr 1fr 1fr 1fr;
                    column-gap: 20px;
                    row-gap: 10px;">
            <div style="background-color: lightcoral;">col1</div>
            <div style="background-color: lightskyblue;">col2</div>
            <div style="background-color: lightsalmon;">col3</div>
            <div style="background-color: lightseagreen;">col4</div>

            <div style="background-color: lightcoral;">col1</div>
            <div style="background-color: lightskyblue;">col2</div>
            <div style="background-color: lightsalmon;">col3</div>
            <div style="background-color: lightseagreen;">col4</div>
        </div>
       
    </body>
</html>
