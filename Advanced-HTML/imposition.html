<!DOCTYPE html>
<html>
   <head>
    <title>imposition</title>
   </head>
   <body style="height: 3000px;
                padding-top: 60px;
                padding-left: 80px;">

        <div style="background-color: rgba(0, 0, 0, 0.3);
                    z-index: 1;
                    position: fixed;
                    height: 180px;
                    width: 320px;
                    right: 80px;
                    bottom: 50px;
                    ">
                 <div style="background-color: black;
                    position: absolute;
                    color: white;
                    padding: 12px 18px 12px 18px;
                    border-radius: 50%;
                    top: -18px;
                    left: -18px;
                    ">X</div>

        <div style="position: absolute;
                    background-color: black;
                    color: white;
                    right: 10px;
                    bottom: 10px;
                    padding: 2px 8px 2px 8px
                    ">2:00</div>
        </div>

        <div style="background-color: lightseagreen;
                    color: white;
                    position: fixed;
                    left: 0px;
                    bottom: 0px;
                    top: 50px;
                    width: 72px;
                    ">leftsidebar

        <div style="position: absolute;
                    background-color: red;
                    color: white;
                    right: 0px;
                    top: 0px
                    ">X</div>
                </div>

        <div style="background-color: lightcoral;
                    color: white;
                    position: fixed;
                    right: 0;
                    bottom: 0;
                    top: 50px;
                    width: 100px;">rightsidebar</div>

        <div style="background-color: black;
                    color: white;
                    position: fixed;
                    top: 0px;
                    left: 0px;
                    right: 0px;
                    height: 50px;
                    z-index: 1;
                    ">Header</div>

        <div style="background-color: lightblue;
                    height: 200px;
                    width: 200px;
                    position: static;
                    ">div1</div>

        <div style="background-color: lightpink;
                    height: 200px;
                    width: 200px;
                    position: relative;
                    ">div2
                    
        <div style="position: absolute;
                    background-color: black;
                    color: white;
                    right: 10px;
                    bottom: 10px
                    ">2:00</div>
        </div>

        <div style="position: absolute;
                    background-color: red;
                    color: white;
                    left: 10px;
                    top: 10px
                    ">Absolute</div>

    
    </body>
</html>
