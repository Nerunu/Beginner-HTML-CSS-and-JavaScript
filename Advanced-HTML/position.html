<!DOCTYPE html>
<html>
    <head>
        <title>positionpractice</title>
    </head>
    <body style="height: 3000px;
                padding-top: 60px;
                padding-left: 80px;">

        <div style="background-color: bisque;
                    position: fixed;
                    right: 200px;
                    bottom: 100px;
                    ">emergent</div>

        <div style="background-color: lightseagreen;
                    color: white;
                    position: fixed;
                    left: 0px;
                    bottom: 0px;
                    top: 50px;
                    width: 72px;
                    ">leftsidebar</div>

        <div style="background-color: lightcoral;
                    color: white;
                    position: fixed;
                    right: 0;
                    bottom: 0;
                    top: 50px;
                    width: 100px;">rightsidebar</div>

        <div style="background-color: black;
                    color: white;
                    position: fixed;
                    top: 0px;
                    left: 0px;
                    right: 0px;
                    height: 50px;
                    ">Header</div>

        <div style="background-color: lightblue;
                    height: 200px;
                    width: 200px;
                    position: static;
                    ">div1</div>

        <div style="background-color: lightpink;
                    height: 200px;
                    width: 200px;
                    ">div2</div>

        <div style="background-color: rgba(0, 0, 0, 0.6);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    position: fixed;
                    top: 0;
                    right: 0;
                    left: 0;
                    bottom: 0;
                    ">
                    <div style="background-color: white;
                                height: 170px;
                                width: 340px;
                                border-radius: 14px;
                                ">
                                <p style="font-size: 38px;
                                        font-weight: bold;
                                        margin: 14px 0px 6px 10px;
                                ">Modal title</p>
                                <p style="font-size: 18px;
                                        margin: 0px 0px 24px 10px
                                ">This is a Modal</p>
                                <button style="margin: 0px 0px 0px 10px;
                                ">Close</button>
                    </div>
        </div>

    </body>
</html>
